[project]
name = "mynah-slm-tools"
version = "0.1.0"
description = "Offline tooling for mynah-slm: the numpy oracle, converters, eval. Never required at inference time."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    # Reads GGUF and dequantizes the K-quants. Same files the C engine reads,
    # on purpose: when the oracle and the engine consume identical weights, a
    # numeric mismatch is our bug and not a quantization difference.
    "gguf>=0.10",
    # HF tokenizers, used as the ground truth our C tokenizer must match.
    "tokenizers>=0.20",
]

[project.optional-dependencies]
# Regenerating tests/fixtures/chat_tools.txt: HF renders the Jinja chat
# template our C writes out by hand, and that rendering is the ground truth.
# transformers without torch is enough — no model is loaded, only the template.
fixtures = [
    "transformers>=4.51",
    "jinja2>=3.1",
]

# Only for proving the ORACLE itself right against transformers. Never needed
# to run the oracle, and never installed in CI.
#
# `accelerate` is NOT optional here despite never being imported by our code:
# transformers requires it both to load a GGUF checkpoint and to honour
# `device_map`. It was present de facto in the environment that produced the
# locked perplexity baselines and was never declared, so a later `uv sync`
# pruned it and the harness started failing on runs that had worked for weeks.
# An undeclared dependency is a reproducibility bug, not a convenience.
check = [
    "torch>=2.4",
    "transformers>=4.51",
    "safetensors>=0.4",
    "accelerate>=0.30",
    "datasets>=2.19",
]

[tool.uv]
package = false
